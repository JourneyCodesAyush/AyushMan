name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --clear
          uv sync
          uv pip install -e . --link-mode=copy
          uv pip install pyinstaller

      - name: Verify pyproject.toml version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)

          if [ -z "$TOML_VERSION" ]; then
            echo "Could not find version in pyproject.toml" >&2
            exit 1
          fi

          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "Version mismatch: tag is v$TAG_VERSION but pyproject.toml has $TOML_VERSION" >&2
            exit 1
          fi

          echo "Version check passed: $TOML_VERSION"

      - name: Extract changelog section
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_body.md

          if [ ! -s release_body.md ]; then
            echo "No changelog section found for $VERSION" >&2
            exit 1
          fi

      - name: Build Windows executable
        run: |
          .venv\Scripts\Activate.ps1
          pyinstaller ayushman.spec

      - name: Zip executable
        run: |
          Compress-Archive -Path dist\ayushman.exe -DestinationPath ayushman-windows-x86_64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: ayushman-windows-x86_64.zip
